name: Run Career Scraper

permissions:
  contents: write

on:
  # Allows you to click a button on the web to run it whenever you want
  workflow_dispatch:
  # Optional: Runs automatically every Monday at 9:00 AM UTC
  schedule:
    - cron: '0 9 * * 1'

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Run Selenium Scraper
      run: |
        mvn compile -Dwebdriver.http.factory=jdk-http-client exec:java -Dexec.mainClass="Daten"
        
    - name: Commit and Push the Job Report File
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
        git add jobs_report.txt
        git commit -m "Automated Data Update: Refresh active job listings" || echo "No changes to commit"
        git push
